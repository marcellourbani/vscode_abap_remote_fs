name: Deploy Docs & Build DOCUMENTATION.md

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install mkdocs-material pyyaml mdx_truly_sane_lists

      - name: Build DOCUMENTATION.md from docs/
        run: python scripts/build_docs.py

      - name: Create PR for DOCUMENTATION.md if changed
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DOCUMENTATION.md
          if ! git diff --staged --quiet; then
            # Create a unique branch name with timestamp
            BRANCH_NAME="docs/auto-generate-docs-$(date +%s)"
            git checkout -b "$BRANCH_NAME"
            git commit -m "docs: auto-generate DOCUMENTATION.md from docs/"
            git remote set-url origin "https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}"
            git push origin "$BRANCH_NAME"
            
            # Create pull request
            gh pr create \
              --base master \
              --head "$BRANCH_NAME" \
              --title "docs: auto-generate DOCUMENTATION.md from docs/" \
              --body "Auto-generated documentation update. Please review and merge if changes look correct." \
              --no-maintainer-edit || true
          fi

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
