name: Deploy Docs & Build DOCUMENTATION.md

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install mkdocs-material pyyaml mdx_truly_sane_lists

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force

      - name: Build DOCUMENTATION.md from docs/
        run: python scripts/build_docs.py

      - name: Commit DOCUMENTATION.md if changed
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DOCUMENTATION.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-generate DOCUMENTATION.md from docs/ [skip ci]"
            git remote set-url origin "https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}"
            git push --force origin HEAD:updatedocumentation
          fi

      - name: Create, approve, and merge documentation PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          pr_number="$(gh pr list --head updatedocumentation --base master --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            pr_number="$(gh pr create \
              --base master \
              --head updatedocumentation \
              --title "docs: update generated documentation" \
              --body "Automated documentation update.")"
          fi
          gh pr merge "$pr_number" --admin --squash --delete-branch
