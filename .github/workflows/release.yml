name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        if: "!contains(github.event.head_commit.message, 'Version Packages')"
        uses: changesets/action@v1
        with:
          version: ./scripts/version-packages.sh
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          CI: false

      - name: Build VSIX and Create Release
        if: "contains(github.event.head_commit.message, 'Version Packages')"
        run: |
          VERSION=$(node -p "require('./package.json').version")
          pnpm release:vsix
          gh release create v$VERSION *.vsix README.md CHANGELOG.md --title "v$VERSION" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
